<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client 'sha256-rWoPukIKbJFKWKUydZ56rhZKpjRMuoo01N0UnSwPTnA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://sheets.googleapis.com https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- viewport-fit=cover lets the app paint under the status bar; the inset rule below
       keeps content clear of it. This is what the Apps Script build could never do, because
       its page is wrapped in a Google frame whose meta tags are not ours to set. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>LoCal</title>
  <meta name="description" content="A calorie tracker that keeps your log in your own Google Drive.">

  <!-- Installed-app behaviour on iOS: no browser chrome, no white strip at the top. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LoCal">
  <meta name="theme-color" content="#23252D">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=ce2b72af">
  <style>
    /* The stylesheet already accounts for the bottom inset on the tab bar, toasts and menus,
       so only the top needs adding here, and only once installed: in Safari the browser's own
       chrome occupies that space and padding would leave a gap. */
    @media (display-mode: standalone) {
      #app { padding-top: env(safe-area-inset-top, 0px); }
    }
    .gate { min-height: 100dvh; display: grid; place-items: center; padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    .gate .inner { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .gate h1 { margin: 4px 0 6px; line-height: 1; }
    /* The LoCal wordmark, built the way the app builds it: Geologica text with the dial as the o. */
    .gate .wm { display: flex; align-items: baseline; justify-content: center; font-size: 52px; font-weight: 300; letter-spacing: -.045em; color: var(--tx, #ECEDF2); }
    .gate .wm svg { margin: 0 3px; position: relative; top: 2px; }
    .gate p { color: var(--mu, #9A9FAC); font-size: 15px; line-height: 1.5; margin: 0; }
    .gate .fine { font-size: 13px; }
    .gate button { min-height: 52px; width: 100%; border: 0; border-radius: 16px; font-size: 16px; font-weight: 600;
      font-family: inherit; color: #2A1600; background: radial-gradient(120% 160% at 35% 20%, #FFC46E, #F08A0C 70%); }
    .gate button[disabled] { opacity: .55; }
    .gate .err { color: #FF8E8E; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="app"><!--boot--><div class="boot"><div style="position:relative;width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#2A2D36,#1F2128);box-shadow:14px 14px 28px var(--lo),-12px -12px 24px var(--hi),inset 0 1px 0 rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="74" height="74" viewBox="0 0 120 120" role="img" aria-label="LoCal app icon"><defs><linearGradient id="lw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16171C"/><stop offset="1" stop-color="#30333D"/></linearGradient><filter id="lg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="60" cy="60" r="47" fill="url(#lw)"/><circle cx="60" cy="60" r="43" fill="#23252D"/><circle cx="60" cy="60" r="34" fill="none" stroke="#17181D" stroke-width="8"/><circle cx="60" cy="60" r="18" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/></svg><span class="spinglow logospin"><span class="spin" style="--s:46.9px;--t:4.9px"></span></span></div><span>Opening your log</span></div><!--/boot--></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="api.js?v=ce2b72af"></script>
  <script>
  /* The app bundle boots itself and asks for data straight away, so it is only loaded once a
     token exists. Signing in first also means the Google popup opens from a real tap, which
     is the only way Safari reliably allows it. */
  // A script error inside the bundle leaves the boot screen up forever: a parse error
  // doesn't fire the script tag's onerror, so nothing would ever report it. Say it on screen.
  function showFailure(title, detail) {
    const el = document.querySelector('#app .boot > span');
    if (!el) return;
    const safe = s => String(s || '').slice(0, 200).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
    el.innerHTML = '<span style="color:#FF8E8E">' + safe(title) + '</span><br><span style="font-size:13px">' + safe(detail) + '</span>';
  }
  window.addEventListener('error', ev =>
    showFailure((ev.filename ? ev.filename.split('/').pop().split('?')[0] : 'The app') + ' failed to load.', ev.message));
  // boot() is async, so a throw inside it is a rejected promise, which 'error' never sees.
  window.addEventListener('unhandledrejection', ev =>
    showFailure('The app stopped while starting.', ev.reason && (ev.reason.message || ev.reason)));

  (function () {
    const app = () => document.getElementById('app');
    // The startup screen the build put in #app (the logo tile with its spinning ring), kept so every
    // loading step can show it with its own line of text.
    const BOOT = app().innerHTML;
    function loading(text) {
      app().innerHTML = BOOT;
      const line = app().querySelector('.boot > span');
      if (line) line.textContent = text;
    }

    // Messages from the proxy are text, never markup.
    const plain = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

    function gate(message, detail, onTap, label) {
      app().innerHTML =
        '<div class="gate"><div class="inner">' +
        '<h1><span class="sr">LoCal</span><span class="wm" aria-hidden="true">L' +
        '<svg width="30" height="30" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#15161B" stroke-width="15"/>' +
        '<circle cx="60" cy="60" r="48" fill="none" stroke="#F5A524" stroke-width="15" stroke-linecap="round" stroke-dasharray="226.2 301.6" transform="rotate(135 60 60)" style="filter:drop-shadow(0 0 4px #F5A524)"/>' +
        '<circle cx="94" cy="94" r="8" fill="#FFD08A"/></svg>Cal</span></h1>' +
        '<p>' + message + '</p>' +
        (onTap ? '<button id="go">' + (label || 'Continue with Google') + '</button>' : '') +
        '<div class="err" id="err"></div>' +
        (detail ? '<p class="fine">' + detail + '</p>' : '') +
        '<p class="fine"><a href="privacy.html" style="color:#F5A524">Privacy</a></p>' +
        '</div></div>';
      const b = document.getElementById('go');
      if (b && onTap) b.onclick = async () => {
        b.disabled = true;
        document.getElementById('err').textContent = '';
        try { await onTap(); } catch (e) {
          b.disabled = false;
          document.getElementById('err').textContent = (e && e.message) || 'Sign-in failed. Try again.';
        }
      };
    }

    function loadApp() {
      loading('Opening your log');
      const s = document.createElement('script');
      s.src = 'app.js?v=ce2b72af';
      s.onerror = () => gate('The app didn\'t load. Check your connection and try again.', '', () => location.reload(), 'Reload');
      document.body.appendChild(s);
    }

    /* Approval happens once, at sign-in: unapproved accounts wait here, before anything is opened
       or created in their Drive. */
    async function admit() {
      loading('Checking your access');
      let r;
      try { r = await LoCalAccess.check(); }
      catch (e) { return gate('LoCal couldn\'t check your access. ' + plain((e && e.message) || ''), '', admit, 'Try again'); }
      if (r.approved) return loadApp();
      if (r.denied) return gate('This Google account doesn\'t have access to LoCal.', 'Ask the owner if you think it should.');
      gate('Your request to use LoCal has been sent to the owner.',
        'Approval is a one-time step. Once you\'re approved, tap Check again.', admit, 'Check again');
    }

    async function start() {
      if (!window.LoCalAuth || !LoCalAuth.configured()) {
        return gate('This copy of LoCal isn\'t set up yet.',
          'It needs a Google OAuth client ID in <code>web/api.js</code> before it can open your Drive.');
      }
      // A token from earlier in the hour: straight in, no screen at all.
      if (LoCalAuth.signedIn()) return admit();
      // Otherwise one tap. Signing in silently isn't possible here: it needs a popup, and
      // Safari only opens popups from a tap, so trying first just added a wait.
      const back = LoCalAuth.returning();
      gate(back ? 'Welcome back. Tap to open your log.'
          : 'Your meals are saved to a spreadsheet in your own Google Drive. Sign in to open it.',
        'LoCal can only see the files it creates for you \u2014 nothing else in your Drive.',
        async () => { await LoCalAuth.signIn(); await admit(); },
        back ? 'Continue' : 'Continue with Google');
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
</body>
</html>
