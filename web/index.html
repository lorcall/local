<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app paint under the status bar; the inset rule below
       keeps content clear of it. This is what the Apps Script build could never do, because
       its page is wrapped in a Google frame whose meta tags are not ours to set. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>LoCal</title>
  <meta name="description" content="A calorie tracker that keeps your log in your own Google Drive.">

  <!-- Installed-app behaviour on iOS: no browser chrome, no white strip at the top. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LoCal">
  <meta name="theme-color" content="#23252D">
  <meta name="color-scheme" content="dark">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@200..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=49436f46">
  <style>
    /* The stylesheet already accounts for the bottom inset on the tab bar, toasts and menus,
       so only the top needs adding here, and only once installed: in Safari the browser's own
       chrome occupies that space and padding would leave a gap. */
    /* Loading skeleton: the Today screen's own layout, pressed in and waiting to be filled. The
       dial's mango arc is the progress bar, so it fills as each background step finishes. */
    .skb { display: block; flex-shrink: 0; border-radius: 8px; background-color: var(--g);
      background-image: linear-gradient(100deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.07) 50%, rgba(255,255,255,0) 62%);
      background-size: 300% 100%; box-shadow: inset 2px 2px 4px var(--lo), inset -2px -2px 4px var(--hi);
      animation: sk-sheen 1.8s ease-in-out infinite; }
    .skb.round { border-radius: 50%; }
    @keyframes sk-sheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
    .sk-arc { stroke: var(--a); filter: drop-shadow(0 0 6px var(--a)); transition: stroke-dasharray .7s cubic-bezier(.3,.7,.2,1); }
    .sk-status { text-align: center; font-size: 13px; color: var(--mu); min-height: 19px; margin-top: -6px; transition: opacity .18s ease; }
    .sk-status.out { opacity: 0; }
    .sk-macro { flex: 1; min-width: 0; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .sk-fab { width: 56px; height: 56px; border-radius: 50%; }
    .sk.failed .skb { animation: none; }
    .sk.failed .sk-arc { stroke: var(--ov); filter: drop-shadow(0 0 6px var(--ov)); }
    .sk.failed .sk-status { color: #FF8E8E; }
    .sk-retry { display: block; margin: 12px auto 0; height: 40px; padding: 0 18px; border-radius: 14px; font-size: 14px; color: var(--a); font-weight: 500; }
    @media (display-mode: standalone) {
      #app { padding-top: env(safe-area-inset-top, 0px); }
    }
    .gate { min-height: 100dvh; display: grid; place-items: center; padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    .gate .inner { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .gate h1 { font-size: 26px; font-weight: 700; margin: 4px 0 0; }
    .gate p { color: var(--mu, #9A9FAC); font-size: 15px; line-height: 1.5; margin: 0; }
    .gate .fine { font-size: 13px; }
    .gate button { min-height: 52px; width: 100%; border: 0; border-radius: 16px; font-size: 16px; font-weight: 600;
      font-family: inherit; color: #2A1600; background: radial-gradient(120% 160% at 35% 20%, #FFC46E, #F08A0C 70%); }
    .gate button[disabled] { opacity: .55; }
    .gate .err { color: #FF8E8E; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="app"><div class="sk" data-skeleton aria-busy="true">
    <div class="scr tabbed" style="gap:16px">
      <header class="col" style="gap:10px">
        <div class="between" style="align-items:center"><span class="skb" style="width:84px;height:22px"></span><span class="ib m" aria-hidden="true"><span class="skb round" style="width:20px;height:20px"></span></span></div>
        <div class="col" style="gap:10px"><span class="skb" style="width:104px;height:12px"></span><span class="skb" style="width:150px;height:26px"></span></div>
      </header>
      <div class="between" style="align-items:center;padding:4px 0">
        <span class="ib ib40" aria-hidden="true"></span>
        <div class="dial raised" role="progressbar" aria-label="Opening your log" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4" style="width:220px;height:220px;box-shadow:12px 12px 24px var(--lo),-10px -10px 22px var(--hi)">
          <div class="well" style="width:180px;height:180px"><div class="glasscore" style="width:126px;height:126px;gap:9px"><span class="skb" style="width:66px;height:32px"></span><span class="skb" style="width:50px;height:10px"></span></div></div>
          <svg class="arc" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true"><circle class="sk-arc" cx="110" cy="110" r="100" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="25 628.3" transform="rotate(-90 110 110)"/></svg>
        </div>
        <span class="ib ib40" aria-hidden="true"></span>
      </div>
      <p class="sk-status" data-status aria-live="polite">Opening LoCal</p>
      <div class="row">
        <div class="raised r20 sk-macro"><span class="skb round" style="width:50px;height:50px"></span><span class="skb" style="width:62px;height:11px"></span><span class="skb" style="width:42px;height:9px"></span></div>
        <div class="raised r20 sk-macro"><span class="skb round" style="width:50px;height:50px"></span><span class="skb" style="width:62px;height:11px"></span><span class="skb" style="width:42px;height:9px"></span></div>
        <div class="raised r20 sk-macro"><span class="skb round" style="width:50px;height:50px"></span><span class="skb" style="width:62px;height:11px"></span><span class="skb" style="width:42px;height:9px"></span></div>
      </div>
      <section class="col" style="gap:12px">
        <span class="skb" style="width:62px;height:16px"></span>
        <div class="raised-md mrow"><span class="skb round" style="width:8px;height:8px"></span><span class="grow col" style="gap:8px"><span class="skb" style="width:64%;height:13px"></span><span class="skb" style="width:40%;height:10px"></span></span><span class="skb" style="width:34px;height:13px"></span></div>
        <div class="raised-md mrow"><span class="skb round" style="width:8px;height:8px"></span><span class="grow col" style="gap:8px"><span class="skb" style="width:52%;height:13px"></span><span class="skb" style="width:34%;height:10px"></span></span><span class="skb" style="width:34px;height:13px"></span></div>
      </section>
    </div>
    <div class="tabbar" aria-hidden="true"><span class="skb round" style="width:22px;height:22px"></span><span class="skb round" style="width:22px;height:22px"></span><span class="raised sk-fab"></span><span class="skb round" style="width:22px;height:22px"></span><span class="skb round" style="width:22px;height:22px"></span></div>
  </div></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="api.js?v=49436f46"></script>
  <script>
  /* The app bundle boots itself and asks for data straight away, so it is only loaded once a
     token exists. Signing in first also means the Google popup opens from a real tap, which
     is the only way Safari reliably allows it. */
  // A script error inside the bundle leaves the boot screen up forever: a parse error
  // doesn't fire the script tag's onerror, so nothing would ever report it. Say it on screen.
  /* Each background step, in order, with how far round the dial it brings the mango arc.
     Copy names what's happening in the user's terms, not the API call behind it. */
  const LOAD_STEPS = {
    app:    [0.10, 'Opening LoCal'],
    signin: [0.22, 'Checking your Google sign-in'],
    folder: [0.40, 'Finding your LoCal App folder'],
    log:    [0.56, 'Opening your log'],
    tabs:   [0.72, 'Checking your log is set up'],
    read:   [0.88, 'Reading your meals and targets']
  };
  let loadFrac = 0.04, statusTimer = 0;
  window.LoCalProgress = function (key, text) {
    const root = document.querySelector('#app [data-skeleton]');
    if (!root) return;
    const step = LOAD_STEPS[key] || [null, key];
    const msg = text || step[1];
    if (step[0] != null && step[0] > loadFrac) {            // the arc only ever moves forward
      loadFrac = step[0];
      const C = 2 * Math.PI * 100;
      const arc = root.querySelector('.sk-arc');
      if (arc) arc.style.strokeDasharray = (loadFrac * C).toFixed(1) + ' ' + C.toFixed(1);
      const bar = root.querySelector('[role=progressbar]');
      if (bar) bar.setAttribute('aria-valuenow', String(Math.round(loadFrac * 100)));
    }
    const line = root.querySelector('[data-status]');
    if (!line || line.textContent === msg) return;
    clearTimeout(statusTimer);
    line.classList.add('out');                                // a quick fade, so a change reads as a change
    statusTimer = setTimeout(() => { line.textContent = msg; line.classList.remove('out'); }, 180);
  };

  // A script error inside the bundle would leave the loading screen up forever: a parse error
  // doesn't fire the script tag's onerror. Stop the skeleton and say what failed instead.
  function showFailure(title, detail) {
    const root = document.querySelector('#app [data-skeleton]');
    const line = root ? root.querySelector('[data-status]') : document.querySelector('#app .boot > span');
    if (!line) return;
    clearTimeout(statusTimer);
    if (root) {
      root.classList.add('failed');
      root.removeAttribute('aria-busy');
    }
    line.classList.remove('out');
    line.textContent = String(title || '') + (detail ? ' ' + String(detail).slice(0, 200) : '');
    if (root && !root.querySelector('.sk-retry')) {
      const b = document.createElement('button');
      b.className = 'raised-sm sk-retry';
      b.textContent = 'Reload';
      b.onclick = () => location.reload();
      line.after(b);
    }
  }
  window.addEventListener('error', ev =>
    showFailure((ev.filename ? ev.filename.split('/').pop().split('?')[0] : 'The app') + ' failed to load.', ev.message));
  // boot() is async, so a throw inside it is a rejected promise, which 'error' never sees.
  window.addEventListener('unhandledrejection', ev =>
    showFailure('The app stopped while starting.', ev.reason && (ev.reason.message || ev.reason)));

  (function () {
    const app = () => document.getElementById('app');
    const SKELETON = app().innerHTML;   // the static skeleton above, kept to show again after sign-in

    function gate(message, detail, onTap, label) {
      app().innerHTML =
        '<div class="gate"><div class="inner">' +
        '<h1>LoCal</h1>' +
        '<p>' + message + '</p>' +
        (onTap ? '<button id="go">' + (label || 'Continue with Google') + '</button>' : '') +
        '<div class="err" id="err"></div>' +
        (detail ? '<p class="fine">' + detail + '</p>' : '') +
        '<p class="fine"><a href="privacy.html" style="color:#F5A524">Privacy</a></p>' +
        '</div></div>';
      const b = document.getElementById('go');
      if (b && onTap) b.onclick = async () => {
        b.disabled = true;
        document.getElementById('err').textContent = '';
        try { await onTap(); } catch (e) {
          b.disabled = false;
          document.getElementById('err').textContent = (e && e.message) || 'Sign-in failed. Try again.';
        }
      };
    }

    function loadApp() {
      app().innerHTML = SKELETON;
      loadFrac = 0.04;
      window.LoCalProgress('app');
      const s = document.createElement('script');
      s.src = 'app.js?v=49436f46';
      s.onerror = () => gate('The app didn\'t load. Check your connection and try again.', '', () => location.reload(), 'Reload');
      document.body.appendChild(s);
    }

    async function start() {
      if (!window.LoCalAuth || !LoCalAuth.configured()) {
        return gate('This copy of LoCal isn\'t set up yet.',
          'It needs a Google OAuth client ID in <code>web/api.js</code> before it can open your Drive.');
      }
      // A token from earlier in the hour: straight in, no screen at all.
      if (LoCalAuth.signedIn()) return loadApp();
      // Otherwise one tap. Signing in silently isn't possible here: it needs a popup, and
      // Safari only opens popups from a tap, so trying first just added a wait.
      const back = LoCalAuth.returning();
      gate(back ? 'Welcome back. Tap to open your log.'
          : 'Your meals are saved to a spreadsheet in your own Google Drive. Sign in to open it.',
        'LoCal can only see the files it creates for you \u2014 nothing else in your Drive.',
        async () => { await LoCalAuth.signIn(); loadApp(); },
        back ? 'Continue' : 'Continue with Google');
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
</body>
</html>
