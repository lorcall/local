  <!-- viewport-fit=cover lets the app paint under the status bar; the inset rule below
       keeps content clear of it. This is what the Apps Script build could never do, because
       its page is wrapped in a Google frame whose meta tags are not ours to set. -->

  <title>LoCal - AI calorie tracker</title>

  <!-- The theme chosen last time (also in the Sheet), applied before anything is drawn. Light needs
       dark status-bar text on iPhone, so it also asks for the standard status bar. -->

  <style>
    /* The stylesheet already accounts for the bottom inset on the tab bar, toasts and menus,
       so only the top needs adding here, and only once installed: in Safari the browser's own
       chrome occupies that space and padding would leave a gap. */
    @media (display-mode: standalone) {
      #app { padding-top: env(safe-area-inset-top, 0px); }
    }
    .gate { min-height: 100dvh; display: grid; place-items: center; padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px)); text-align: center; }
    .gate .inner { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .gate h1 { margin: 4px 0 6px; line-height: 1; }
    /* The LoCal wordmark: the same picture as in the app (icons/wordmark.png, embedded by the build). */
    .gate .wm.light, :root[data-theme="light"] .gate .wm.dark { display: none !important; }
    :root[data-theme="light"] .gate .wm.light { display: block !important; }
    .gate .wm { display: block; height: 38.4px; width: auto; margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; pointer-events: none; }
    .gate p { color: var(--mu, #9A9FAC); font-size: 15px; line-height: 1.5; margin: 0; }
    .gate h1, .gate .tagline, #app .boot { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .gate .tagline { font-size: 16px; font-weight: 400; color: var(--soft, #D6D8E0); margin: -12px 0 6px; letter-spacing: .01em; }
    .gate .fine { font-size: 13px; }
    .gate button { min-height: 52px; width: 100%; border: 0; border-radius: 16px; font-size: 16px; font-weight: 600;
      font-family: inherit; color: #2A1600; background: radial-gradient(120% 160% at 35% 20%, #FFC46E, #F08A0C 70%); }
    .gate button[disabled] { opacity: .55; }
    .gate .err { color: #FF8E8E; font-size: 14px; min-height: 18px; }

  <script>
  /* The app bundle boots itself and asks for data straight away, so it is only loaded once a
     token exists. Signing in first also means the Google popup opens from a real tap, which
     is the only way Safari reliably allows it. */
  // A script error inside the bundle leaves the boot screen up forever: a parse error
  // doesn't fire the script tag's onerror, so nothing would ever report it. Say it on screen.
  function showFailure(title, detail) {
    const el = document.querySelector('#app .boot > span');
    if (!el) return;
    const safe = s => String(s || '').slice(0, 200).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
    el.innerHTML = '<span style="color:#FF8E8E">' + safe(title) + '</span><br><span style="font-size:13px">' + safe(detail) + '</span>';
  }
  window.addEventListener('error', ev =>
    showFailure((ev.filename ? ev.filename.split('/').pop().split('?')[0] : 'The app') + ' failed to load.', ev.message));
  // boot() is async, so a throw inside it is a rejected promise, which 'error' never sees.
  window.addEventListener('unhandledrejection', ev =>
    showFailure('The app stopped while starting.', ev.reason && (ev.reason.message || ev.reason)));

        '<div class="tagline">AI calorie tracker</div>' +
        '<p>' + message + '</p>' +
        (onTap ? '<button id="go">' + (label || 'Continue with Google') + '</button>' : '') +
        '<div class="err" id="err"></div>' +
        (detail ? '<p class="fine">' + detail + '</p>' : '') +
        '<p class="fine"><a href="privacy.html" style="color:var(--ai, #F5A524)">Privacy</a></p>' +
        '</div></div>';
      const b = document.getElementById('go');
      if (b && onTap) b.onclick = async () => {
        b.disabled = true;
        document.getElementById('err').textContent = '';
        try { await onTap(); } catch (e) {
          b.disabled = false;
          document.getElementById('err').textContent = (e && e.message) || 'Sign-in failed. Try again.';
        }
      };
    }

    function loadApp() {
      loading('Opening your log');
      const s = document.createElement('script');
      s.src = 'app.js?v=3b568ab2';
      s.onerror = () => gate('The app didn\'t load. Check your connection and try again.', '', () => location.reload(), 'Reload');
      document.body.appendChild(s);
    }

    /* Approval happens once, at sign-in: unapproved accounts wait here, before anything is opened
       or created in their Drive. */
    async function admit() {
      loading('Checking your access');
      let r;
      try { r = await LoCalAccess.check(); }
      catch (e) { return gate('LoCal couldn\'t check your access. ' + plain((e && e.message) || ''), '', admit, 'Try again'); }
      if (r.approved) return loadApp();
      if (r.denied) return gate('This Google account doesn\'t have access to LoCal.', 'Ask the owner if you think it should.');
      gate('Your request to use LoCal has been sent to the owner.',
        'Approval is a one-time step. Once you\'re approved, tap Check again.', admit, 'Check again');
    }

    async function start() {
      if (!window.LoCalAuth || !LoCalAuth.configured()) {
        return gate('This copy of LoCal isn\'t set up yet.',
          'It needs a Google OAuth client ID in <code>web/api.js</code> before it can open your Drive.');
      }
      // A token from earlier in the hour: straight in, no screen at all.
      if (LoCalAuth.signedIn()) return admit();
      // Otherwise one tap. Signing in silently isn't possible here: it needs a popup, and
      // Safari only opens popups from a tap, so trying first just added a wait.
      const back = LoCalAuth.returning();
      gate(back ? 'Welcome back. Tap to open your log.'
          : 'Your meals are saved to a spreadsheet in your own Google Drive. Sign in to open it.',
        'LoCal can only see the files it creates for you \u2014 nothing else in your Drive.',
        async () => { await LoCalAuth.signIn(); await admit(); },
        back ? 'Continue' : 'Continue with Google');
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
