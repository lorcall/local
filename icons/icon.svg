<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <title>LoCal</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(10 .5 .5)"><stop offset="0" stop-color="#2A2D36"/><stop offset="1" stop-color="#1F2128"/></linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16171C"/><stop offset="1" stop-color="#30333D"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="120" height="120" rx="29" fill="url(#tile)"/>
  <g transform="translate(60 60) scale(.8) translate(-60 -60)">
    <circle cx="60" cy="60" r="47" fill="url(#well)"/>
    <circle cx="60" cy="60" r="43" fill="#23252D"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#17181D" stroke-width="8"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#F5A524" stroke-width="8" stroke-linecap="round" stroke-dasharray="160.2 213.6" transform="rotate(135 60 60)" filter="url(#glow)"/>
    <circle cx="84" cy="84" r="5.5" fill="#FFD08A" filter="url(#glow)"/>
    <circle cx="60" cy="60" r="18" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/>
  </g>
</svg>
